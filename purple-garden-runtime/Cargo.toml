[package]
name = "purple-garden-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
purple-garden-ir = { path = "../purple-garden-ir" }
purple-garden-allocators = { path = "../purple-garden-allocators" }
purple-garden-shared = { path = "../purple-garden-shared" }

[features]
default = ["threaded"]
# tail calls between op handlers instead of a dispatch loop
threaded = []
trace = []
trace_gc = ["purple-garden-shared/trace"]
