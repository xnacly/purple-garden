[package]
name = "purple-garden-fuzz"
version = "0.1.0"
description = "Generator of well-typed, terminating Purple Garden programs and the differential oracle comparing the bytecode VM and the JIT at every optimisation level"
edition = "2024"
publish = false

[features]
# Guard-page every object the programs allocate, see purple-garden-runtime's `gc_stress`: an
# access past an object faults right there instead of reading its neighbour.
gc_stress = ["purple-garden/gc_stress"]

[dependencies]
arbitrary = "1.4"
purple-garden = { path = "../purple-garden" }
